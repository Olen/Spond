[project]
name = "spond"
version = "1.2.1"
description = "Simple, unofficial library with some example scripts to access data from the Spond API."
authors = [
    {name = "Ola Thoresen", email = "ola@nytt.no"}
]
license = "GPL-3.0-only"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.13.0",
]

[project.urls]
Repository = "https://github.com/Olen/Spond"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pdoc==16.0.0",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-socket==0.7.0",
    "ruff==0.16.10",
    # Pin exact versions of dependencies for CI reproducibility
]

[tool.mypy]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["ics.*"]  # Used in `examples/ical.py`, but not a project dependency, so won't be installed
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["config"]  # Used in `examples/`, but not present by default
ignore_missing_imports = true

[tool.pytest.ini_options]
# Pinned explicitly: pytest-asyncio's default is currently unset and will
# flip to "function" in a future release — set now so behaviour can't drift.
asyncio_default_fixture_loop_scope = "function"
# The suite is fully mocked and must never reach the network. Without this, a
# gap in a mock doesn't fail — it sends a real request to api.spond.com, which
# is slow, non-deterministic, dependent on credentials CI doesn't have, and
# capable of passing for the wrong reason.
#
# `--allow-unix-socket` is required, not optional: asyncio builds its event
# loop self-pipe with `socket.socketpair()` (AF_UNIX on Linux), so blocking
# every socket would break the event loop and with it every async test.
#
# A test that genuinely needs the network must opt in explicitly with
# `@pytest.mark.enable_socket`.
addopts = "--disable-socket --allow-unix-socket"

[tool.ruff.format]
# Docs snippets are illustrative, not compiled: keep hand-alignment readable.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "ANN",  # flake8-annotations
    "E",  # pycodestyle
    "F",  # Pyflakes
    "I",  # isort
    "SIM",  # flake8-simplify
    "UP",  # pyupgrade
]
ignore = [
    "ANN002",  # Missing type annotation for `*args`
    "ANN003",  # Missing type annotation for `**kwargs`
    "E501",  # Line too long: needs code refactors first
]

[tool.ruff.lint.per-file-ignores]
# In example files:
# - Don't try to sort imports as non-existent `config` module causes issues in CI
"examples/*" = ["I001"]

[tool.uv]
resolution = "lowest-direct"
