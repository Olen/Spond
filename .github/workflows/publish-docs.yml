name: Publish API docs

on:
  push:
    branches: [main]
  workflow_dispatch:  # allow manual rebuild without a push

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deploys so a fast follow-up push doesn't race a mid-flight deploy.
# Don't cancel in-progress — half-uploaded artifacts can leave Pages broken.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 📚 Build docs with pdoc
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Olen'  # skip on forks
    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Install a specific version of uv.
          version: "0.13.0"

      - name: 🐍 Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: 📝 Generate static HTML
        # `./spond` (not `spond`) forces pdoc to document the local checkout
        # instead of any same-named module that might be importable.
        # `--docformat numpy` parses NumPy-style Parameters/Returns/Raises
        # sections as structured lists rather than flat paragraphs.
        run: uv run pdoc --docformat numpy -o site/ ./spond

      - name: ⚙️ Configure Pages
        uses: actions/configure-pages@v6

      - name: 📦 Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

  deploy:
    name: 🚀 Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Olen'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🌐 Deploy
        id: deployment
        uses: actions/deploy-pages@v5
